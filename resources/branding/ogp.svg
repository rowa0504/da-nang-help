<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- OGP link-preview image (1200x630). Source of truth for
       public/og-image.png, generated by scripts/generate-favicons.mjs.
       Reversed (white-on-teal) version of the mark in resources/branding/mark.svg,
       plus the wordmark and English tagline for social link previews. -->
  <rect width="1200" height="630" fill="#0F766E" />

  <!-- Subtle coastline motif, low-contrast against the background. -->
  <path
    d="M0 560 Q150 540 300 560 T600 560 T900 560 T1200 560 V630 H0 Z"
    fill="#115E59"
  />

  <!-- Symbol, reversed for a dark background: white pin, teal house cutout,
       light-orange wave. Same path data as mark.svg, scaled up. -->
  <g transform="translate(150,135) scale(3.2)">
    <path
      d="M32 58 C20 46 8 34 8 24 C8 12.7 18.7 4 32 4 C45.3 4 56 12.7 56 24 C56 34 44 46 32 58 Z"
      fill="#FFFFFF"
    />
    <path d="M20 24 L32 14 L44 24 L44 34 L20 34 Z" fill="#0F766E" />
    <path
      d="M24 43 Q28 40 32 43 Q36 46 40 43"
      stroke="#FDBA74"
      stroke-width="2.2"
      fill="none"
      stroke-linecap="round"
    />
  </g>

  <text
    x="480"
    y="300"
    font-family="'Instrument Sans', ui-sans-serif, system-ui, sans-serif"
    font-size="72"
    font-weight="700"
    fill="#FFFFFF"
  >Da Nang <tspan fill="#FDBA74">Help</tspan></text>

  <text
    x="480"
    y="360"
    font-family="'Instrument Sans', ui-sans-serif, system-ui, sans-serif"
    font-size="28"
    fill="#F0FDFA"
  >Connecting Da Nang residents with trusted</text>
  <text
    x="480"
    y="398"
    font-family="'Instrument Sans', ui-sans-serif, system-ui, sans-serif"
    font-size="28"
    fill="#F0FDFA"
  >local service providers.</text>
</svg>
