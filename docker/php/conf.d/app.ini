; Application-level PHP runtime settings for Da Nang Help.
;
; memory_limit=256M: synchronous photo processing (ProcessUploadedPhoto)
; decodes/rotates/resizes GD image buffers that can reach tens of MB each
; for a single request; 256M balances that against running on a small
; Fargate task in production.
;
; upload_max_filesize/post_max_size/max_file_uploads: match the Service
; Request photo upload limits (5MB per file via CreateServiceRequestRequest,
; up to 5 files). post_max_size is sized generously above 5 files x 6MB plus
; the rest of the form fields.
memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 32M
max_file_uploads = 5
